<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishi To Go! - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="planner-page">
  <header class="main-header">
    <div class="header-bar">
      <div class="header-text">
        <i>Ishi To Go!</i>
        <span class="subtitle">&gt; your tiny expense tracker</span>
      </div>
    </div>
  </header>

  <main class="planner-container">
    <h1 class="planner-title">Expense Tracker</h1>
    <p class="planner-subtitle">Keep your spending in one little place.</p>

    <section class="budget-summary" aria-label="Expense summary">
      <div class="summary-card">
        <h3>Total spent</h3>
        <div id="totalAmount" class="amount">$0.00</div>
      </div>
    </section>

    <section class="task-input-section" aria-labelledby="expense-form-title">
      <h2 id="expense-form-title" class="section-title">Add an expense</h2>
      <form id="expenseForm" class="input-group">
        <label class="sr-only" for="expenseInput">Expense name</label>
        <input id="expenseInput" class="budget-input" type="text" placeholder="What did you buy?" maxlength="100" required>
        <label class="sr-only" for="amountInput">Expense amount</label>
        <input id="amountInput" class="budget-input" type="number" min="0.01" step="0.01" placeholder="Amount" required>
        <label class="sr-only" for="categoryInput">Expense category</label>
        <input id="categoryInput" class="budget-input" type="text" placeholder="Category" maxlength="40" required>
        <button class="add-task-btn" type="submit">Add expense</button>
      </form>
    </section>

    <section class="category-section" aria-labelledby="expenses-title">
      <h2 id="expenses-title" class="section-title">My expenses <span id="expenseCount">(0)</span></h2>
      <ul id="expenseList" class="budget-list"></ul>
      <p id="emptyState" class="empty-state">No expenses yet. Add one above!</p>
    </section>
  </main>

  <button id="backBtn" class="small-btn" type="button">Back</button>

  <script>
    const expenseForm = document.getElementById('expenseForm');
    const expenseInput = document.getElementById('expenseInput');
    const amountInput = document.getElementById('amountInput');
    const categoryInput = document.getElementById('categoryInput');
    const expenseList = document.getElementById('expenseList');
    const emptyState = document.getElementById('emptyState');
    const expenseCount = document.getElementById('expenseCount');
    const totalAmount = document.getElementById('totalAmount');
    const userId = Number(localStorage.getItem('userId'));
    let expenses = [];

    function renderExpenses() {
      expenseList.innerHTML = '';
      expenses.forEach(function(expense) {
        const item = document.createElement('li');
        item.className = 'budget-item';
        item.innerHTML = `
          <div class="budget-item-content">
            <span class="task-name"></span>
            <span class="expense-category"></span>
            <strong class="amount"></strong>
          </div>
          <div class="task-actions">
            <button class="edit-btn" type="button" data-action="edit" data-id="${expense.id}">Edit</button>
            <button class="delete-btn" type="button" data-action="delete" data-id="${expense.id}">Delete</button>
          </div>`;
        item.querySelector('.task-name').textContent = expense.name;
        item.querySelector('.expense-category').textContent = expense.category;
        item.querySelector('.amount').textContent = '$' + Number(expense.amount).toFixed(2);
        expenseList.appendChild(item);
      });
      emptyState.hidden = expenses.length > 0;
      expenseCount.textContent = '(' + expenses.length + ')';
      totalAmount.textContent = '$' + expenses.reduce(function(total, expense) {
        return total + expense.amount;
      }, 0).toFixed(2);
    }

    async function loadExpenses() {
      const response = await fetch('/api/expenses?user_id=' + userId);
      expenses = await response.json();
      renderExpenses();
    }

    expenseForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      const name = expenseInput.value.trim();
      const amount = Number(amountInput.value);
      const category = categoryInput.value.trim();
      if (!name || !Number.isFinite(amount) || amount <= 0 || !category) return;
      await fetch('/api/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, name: name, amount: amount, category: category })
      });
      await loadExpenses();
      expenseForm.reset();
      expenseInput.focus();
    });

    expenseList.addEventListener('click', async function(event) {
      const button = event.target.closest('button');
      if (!button) return;
      const id = Number(button.dataset.id);
      const expense = expenses.find(function(item) { return item.id === id; });
      if (!expense) return;

      if (button.dataset.action === 'edit') {
        const item = button.closest('.budget-item');
        item.innerHTML = `
          <div class="expense-edit-fields">
            <input class="edit-name" type="text" aria-label="Expense name" maxlength="100">
            <input class="edit-amount" type="number" aria-label="Expense amount" min="0.01" step="0.01">
            <input class="edit-category" type="text" aria-label="Expense category" maxlength="40">
          </div>
          <div class="task-actions">
            <button class="edit-btn" type="button" data-action="save" data-id="${id}">Save</button>
            <button class="delete-btn" type="button" data-action="cancel" data-id="${id}">Cancel</button>
          </div>`;
        item.querySelector('.edit-name').value = expense.name;
        item.querySelector('.edit-amount').value = expense.amount;
        item.querySelector('.edit-category').value = expense.category;
        item.querySelector('.edit-name').focus();
        return;
      }

      if (button.dataset.action === 'cancel') {
        renderExpenses();
        return;
      }

      if (button.dataset.action === 'save') {
        const item = button.closest('.budget-item');
        const name = item.querySelector('.edit-name').value.trim();
        const amount = Number(item.querySelector('.edit-amount').value);
        const category = item.querySelector('.edit-category').value.trim();
        if (!name || !Number.isFinite(amount) || amount <= 0 || !category) return;
        await fetch('/api/expenses/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, name: name, amount: amount, category: category })
        });
      } else if (button.dataset.action === 'delete') {
        await fetch('/api/expenses/' + id + '?user_id=' + userId, { method: 'DELETE' });
      } else {
        return;
      }
      await loadExpenses();
    });

    document.getElementById('backBtn').addEventListener('click', function() {
      window.location.href = 'index.html';
    });

    if (!userId) {
      window.location.href = 'loginPage.html';
    } else {
      loadExpenses();
    }
  </script>
</body>
</html>
